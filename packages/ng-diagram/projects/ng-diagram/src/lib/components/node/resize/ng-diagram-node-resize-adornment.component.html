<ng-content></ng-content>

@if (showAdornment()) {
  @for (position of linePositions; track position) {
    <ng-diagram-resize-line [position]="position" [targetData]="nodeData()!" [active]="activeSideSet().has(position)" />
  }
  @for (handle of handles(); track handle.position) {
    @if (handle.active) {
      <ng-diagram-resize-handle [position]="handle.position" [targetData]="nodeData()!" />
    }
  }
}
