<svg [style.color]="stroke() || 'var(--edge-stroke, var(--ngd-default-edge-stroke))'">
  <!-- Inline markers for Safari (context-stroke not supported) -->
  @if (useInlineMarkers) {
    <defs
      ngDiagramInlineMarkers
      [sourceMarkerId]="sourceMarkerId()"
      [targetMarkerId]="targetMarkerId()"
      [edgeId]="edge().id"
    ></defs>
  }

  <path
    [class]="class()"
    [attr.d]="path()"
    [attr.stroke]="stroke() || 'var(--edge-stroke, var(--ngd-default-edge-stroke))'"
    [attr.fill]="'none'"
    [attr.stroke-width]="strokeWidth() || 'var(--edge-stroke-width, 2)'"
    [attr.stroke-dasharray]="strokeDasharray() || 'var(--edge-stroke-dasharray, none)'"
    [attr.marker-start]="markerStart()"
    [attr.marker-end]="markerEnd()"
    [attr.stroke-opacity]="strokeOpacity() || 'var(--edge-stroke-opacity, 1)'"
  />
  <path [attr.d]="path()" fill="none" stroke="none" stroke-width="20" stroke-opacity="0" />

  <!-- Invisible hit circles: a finger-friendly grab area that keeps a
       constant screen size at any zoom. Both hit circles render before both
       visible handles, so a visible handle is never covered by the other
       end's hit area on a short edge. The hit circle and the handle carry the
       same directive, so grabbing either starts the relink;
       data-relink-handle-hit lets the stylesheet highlight the matching
       handle on hover. Each end renders only when it can be relinked. A
       relink preview has no hit circles: its handles only show the gesture.
       On an end connected to a port the stylesheet moves the hit circle and
       the handle into the port, along --ngd-relink-handle-inset-x/-y. -->
  @if (relinkSourceHandleVisible() && !temporary()) {
    <circle
      class="ng-diagram-edge__relink-handle-hit"
      data-relink-handle-hit="source"
      ngDiagramRelinkHandle
      [edge]="edge()"
      end="source"
      [style.--ngd-relink-handle-inset-x]="relinkSourceHandleInset()?.x ?? null"
      [style.--ngd-relink-handle-inset-y]="relinkSourceHandleInset()?.y ?? null"
      [attr.cx]="relinkSourceHandle().x"
      [attr.cy]="relinkSourceHandle().y"
      [attr.r]="relinkHandleHitRadius()"
    />
  }
  @if (relinkTargetHandleVisible() && !temporary()) {
    <circle
      class="ng-diagram-edge__relink-handle-hit"
      data-relink-handle-hit="target"
      ngDiagramRelinkHandle
      [edge]="edge()"
      end="target"
      [style.--ngd-relink-handle-inset-x]="relinkTargetHandleInset()?.x ?? null"
      [style.--ngd-relink-handle-inset-y]="relinkTargetHandleInset()?.y ?? null"
      [attr.cx]="relinkTargetHandle().x"
      [attr.cy]="relinkTargetHandle().y"
      [attr.r]="relinkHandleHitRadius()"
    />
  }
  @if (relinkSourceHandleVisible()) {
    <g
      class="ng-diagram-edge__relink-handle"
      [class.ng-diagram-edge__relink-handle--dragging]="relinkDraggedEnd() === 'source'"
      data-relink-handle="source"
      ngDiagramRelinkHandle
      [edge]="edge()"
      end="source"
      [style.--ngd-relink-handle-inset-x]="relinkSourceHandleInset()?.x ?? null"
      [style.--ngd-relink-handle-inset-y]="relinkSourceHandleInset()?.y ?? null"
    >
      <circle
        class="ng-diagram-edge__relink-handle-halo"
        [attr.cx]="relinkSourceHandle().x"
        [attr.cy]="relinkSourceHandle().y"
      />
      <circle
        class="ng-diagram-edge__relink-handle-circle"
        [attr.cx]="relinkSourceHandle().x"
        [attr.cy]="relinkSourceHandle().y"
      />
    </g>
  }
  @if (relinkTargetHandleVisible()) {
    <g
      class="ng-diagram-edge__relink-handle"
      [class.ng-diagram-edge__relink-handle--dragging]="relinkDraggedEnd() === 'target'"
      data-relink-handle="target"
      ngDiagramRelinkHandle
      [edge]="edge()"
      end="target"
      [style.--ngd-relink-handle-inset-x]="relinkTargetHandleInset()?.x ?? null"
      [style.--ngd-relink-handle-inset-y]="relinkTargetHandleInset()?.y ?? null"
    >
      <circle
        class="ng-diagram-edge__relink-handle-halo"
        [attr.cx]="relinkTargetHandle().x"
        [attr.cy]="relinkTargetHandle().y"
      />
      <circle
        class="ng-diagram-edge__relink-handle-circle"
        [attr.cx]="relinkTargetHandle().x"
        [attr.cy]="relinkTargetHandle().y"
      />
    </g>
  }
</svg>

<ng-content />
